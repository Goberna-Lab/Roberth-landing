name: Deploy

# Deploy de Roberth-landing a vps2 (roberthestratega.com). El runner
# (label "roberth") corre EN vps2, así que el rsync al docroot es LOCAL (sin red).
# Mismo patrón que landing-lucy. CI (ci.yml) valida el build en el PR; acá solo
# se hace el build del merge commit + rsync.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-roberth
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, roberth]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --no-fund
          npm run build

      - name: Guard dist + rsync local al docroot
        run: |
          set -euo pipefail
          DOCROOT=/srv/nexus-containers/roberth/public
          # GUARD: rsync --delete con dist/ sin index.html borraría el sitio.
          [ -f dist/index.html ] || { echo "::error::falta dist/index.html -> abort"; exit 1; }
          sudo rsync -rl --delete --chmod=D755,F644 dist/ "$DOCROOT/"
          echo "deploy OK -> $DOCROOT"
